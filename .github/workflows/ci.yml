name: CI

on:
  push:
    branches: [master-branch, deploy/intellihire-v8]
  pull_request:
    branches: [master-branch]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          APP_URL: https://ci-placeholder.invalid
          API_URL: https://ci-placeholder.invalid
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: ci-placeholder
          GOOGLE_REDIRECT_URI: https://ci-placeholder.invalid/api/auth/google/callback
          SESSION_SECRET: ci-placeholder-secret-at-least-32-characters-long
