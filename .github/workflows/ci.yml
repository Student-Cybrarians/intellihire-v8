name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          NODE_ENV: test

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders only — never real secrets. Real values are
          # injected as GitHub Actions secrets / platform env vars at deploy
          # time, not committed or referenced here. See docs/DEPLOYMENT.md.
          APP_URL: https://ci-placeholder.invalid
          API_URL: https://ci-placeholder.invalid
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: ci-placeholder
          GOOGLE_REDIRECT_URI: https://ci-placeholder.invalid/api/auth/google/callback
          SESSION_SECRET: ci-placeholder-secret-at-least-32-characters-long
