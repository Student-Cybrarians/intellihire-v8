name: Module 1 Verification

on:
  push:
    branches: [master-branch]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          APP_URL: https://ci-placeholder.invalid
          API_URL: https://ci-placeholder.invalid
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: ci-placeholder
          GOOGLE_REDIRECT_URI: https://ci-placeholder.invalid/api/auth/google/callback
          SESSION_SECRET: ci-placeholder-secret-at-least-32-characters-long
          ADMIN_EMAIL: admin@example.com
          OPENROUTER_API_KEY: ci-placeholder
      - name: Production build
        run: npm run build
        env:
          APP_URL: https://ci-placeholder.invalid
          API_URL: https://ci-placeholder.invalid
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: ci-placeholder
          GOOGLE_REDIRECT_URI: https://ci-placeholder.invalid/api/auth/google/callback
          SESSION_SECRET: ci-placeholder-secret-at-least-32-characters-long
          ADMIN_EMAIL: admin@example.com
          OPENROUTER_API_KEY: ci-placeholder
